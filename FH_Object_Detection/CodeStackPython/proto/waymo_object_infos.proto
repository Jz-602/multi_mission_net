syntax = "proto3";

package object_info;

message NDArray {
  repeated int32 shape = 1;
  repeated double data = 2;
}

message Object {
  string id = 1;
  int32 type = 2;
  NDArray difficulty_level = 3;
  int32 num_points_in_top_lidar = 4;  
  int32 num_points_in_all_lidar = 5;
  NDArray speed = 6;
  NDArray box = 7;
}

message FrameInfo {
  NDArray pose = 1;
  int64 frame_timestamp_micros = 2;
  repeated Object objects = 3;
}

message ObjectInfos {
  repeated FrameInfo frames = 1;
}
